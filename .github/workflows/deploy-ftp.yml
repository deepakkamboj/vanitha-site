name: Deploy to FTP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.vanitha-ca.org
          username: vanithac
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          dangerous-clean-slate: false

      - name: Validate site is live
        run: |
          echo "Waiting for site to propagate..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://vanitha-ca.org)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "ERROR: Site returned HTTP $STATUS"
            exit 1
          fi
          echo "Site is live and returning HTTP 200"
